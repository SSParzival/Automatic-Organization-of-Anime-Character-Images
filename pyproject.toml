[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-character-organizer"
version = "0.1.0"
description = "A modular pipeline for unsupervised organization of anime character images using visual similarity and semantic tagging."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ssparzival"}
]
dependencies = [
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "imagehash>=4.3.0",
    "dghs-imgutils>=0.19.0",
    "hdbscan>=0.8.30",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
