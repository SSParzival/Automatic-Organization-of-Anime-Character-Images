[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-character-organizer"
version = "0.1.0"
description = "A modular pipeline for unsupervised organization of anime character images using visual similarity and semantic tagging."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "ssparzival"}
]
dependencies = [
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "imagehash>=4.3.0",
    "dghs-imgutils>=0.19.0",
    "hdbscan>=0.8.30",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
    "nbformat>=5.0.0",
    "nbclient>=0.10.0",
    "ipykernel>=6.0.0",
    "build>=1.0.0",
    "mypy>=1.10.0",
    "pyyaml>=6.0.0",
]

notebook = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",
    "nbclient>=0.10.0",
    "nbformat>=5.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false
# Explicit packages prevent recursive discovery of protected or accidental packages.
packages = [
    "anime_character_organizer",
    "anime_character_organizer.utils",
    "anime_character_organizer.data",
    "anime_character_organizer.preprocessing",
    "anime_character_organizer.embeddings",
    "anime_character_organizer.clustering",
    "anime_character_organizer.materialization",
    "anime_character_organizer.tagging",
    "anime_character_organizer.visualization",
    "anime_character_organizer.workflows",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore-glob=**/sandbox/** -v"
norecursedirs = ["sandbox", ".git", ".venv", ".audit", "build", "dist"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "sandbox",
    ".venv",
    ".git",
    "__pycache__",
    "*.egg-info",
    ".audit",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
files = ["src/anime_character_organizer"]
exclude = '(^|/)sandbox/'
